<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>暖白咖啡首页</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3eb;color:#30372c;font:14px/1.6 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid #deded0}.brand{font-weight:750;letter-spacing:.06em;font-size:17px}.brand span{color:#6b7660;font-size:10px;display:block;letter-spacing:.18em;font-weight:500}nav{display:flex;gap:22px;font-size:11px;color:#767a6d}.hero{padding:30px 28px 20px}.eyebrow{font-size:10px;letter-spacing:.15em;color:#7d806f;margin:0 0 16px}h1{font-family:ui-serif,Georgia,serif;font-size:clamp(28px,7vw,44px);line-height:1.25;letter-spacing:-.03em;margin:0 0 14px;font-weight:600}.desc{color:#73786b;max-width:280px;font-size:12px;line-height:1.9;margin:0 0 20px}.primary{border:0;background:#4c5c42;color:#fff;padding:11px 18px;border-radius:5px;font-size:12px}.scene{height:155px;margin:25px 0 0;border-radius:9px;background:#e8e4d7;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.scene:before{content:'';position:absolute;width:190px;height:190px;border:1px solid #d0ccbc;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.cup{position:relative;width:103px;height:89px;background:linear-gradient(100deg,#faf8ef,#d4d0bd);border-radius:8px 8px 35px 35px;box-shadow:0 15px 17px #52483325}.cup:before{content:'';position:absolute;top:-5px;left:0;right:0;height:17px;border:7px solid #e1ddcb;background:#4e3324;border-radius:50%}.cup:after{content:'';position:absolute;right:-29px;top:14px;width:36px;height:46px;border:9px solid #d4d0bd;border-left:0;border-radius:0 24px 24px 0}.scene-label{position:absolute;bottom:10px;right:13px;font-size:9px;letter-spacing:.12em;color:#8d8874}.menu{padding:4px 28px 24px}.section{display:flex;justify-content:space-between;align-items:center;margin:5px 0 13px}.section h2{font-size:13px;font-weight:600;margin:0}.section small{font-size:10px;color:#818575}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{border:1px solid #deded0;background:#fbf9f3;border-radius:7px;padding:13px}.product .tag{font-size:9px;color:#879078;letter-spacing:.1em}.product h3{font-size:12px;margin:6px 0 3px}.product p{font-size:10px;color:#8a8c7b;margin:0 0 8px}.price{font-size:13px;font-weight:600}.product button{float:right;border:1px solid #d1d6c7;background:transparent;color:#59634d;border-radius:50%;width:23px;height:23px;line-height:15px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#30372c;color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}footer{padding:12px 28px;border-top:1px solid #deded0;color:#989b8a;font-size:9px;display:flex;justify-content:space-between}@media(max-width:380px){nav{gap:12px}header,.hero,.menu{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<header><div class="brand">慢一点<span>SLOW MORNING COFFEE</span></div><nav><span>咖啡</span><span>关于我们</span></nav></header>
<main><section class="hero"><p class="eyebrow">A LITTLE PAUSE, A BETTER DAY.</p><h1>让今天，<br>从一杯好咖啡开始。</h1><p class="desc">精选当季咖啡豆，认真做好每一杯。<br>留一点时间，给自己。</p><button class="primary" onclick="document.querySelector('.menu').scrollIntoView({behavior:'smooth'})">看看今日咖啡 ↗</button><div class="scene"><div class="cup"></div><span class="scene-label">BREWED WITH CARE</span></div></section>
<section class="menu"><div class="section"><h2>今日推荐</h2><small>新鲜烘焙 · 每日供应</small></div><div class="products"><article class="product"><span class="tag">HOUSE FAVORITE</span><h3>燕麦拿铁</h3><p>柔和坚果香，口感顺滑</p><span class="price">¥ 28</span><button aria-label="选择燕麦拿铁" onclick="notify('已选择燕麦拿铁')">+</button></article><article class="product"><span class="tag">SINGLE ORIGIN</span><h3>当季手冲</h3><p>明亮果香，干净尾韵</p><span class="price">¥ 32</span><button aria-label="选择当季手冲" onclick="notify('已选择当季手冲')">+</button></article></div></section></main>
<footer><span>把日常，慢慢过好。</span><span>OPEN 08:00—19:00</span></footer><div class="toast" role="status"></div>
<script>function notify(text){const el=document.querySelector('.toast');el.textContent=text;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2000)}</script>
</body></html>
